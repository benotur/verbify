<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verbify - Profile</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./images/verbifytransparent.png"
    />
    <script
      src="https://kit.fontawesome.com/4e794a5347.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./styles/profiles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <div class="container">
      <h1>Verbify</h1>
      <h2>Profile</h2>
          
      <div id="customAlertContainer" style="display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background-color: #f8d7da; color: #721c24; padding: 10px 20px; border: 1px solid #f5c6cb; border-radius: 5px; z-index: 1000;">
        <span id="customAlertMessage"></span>
      </div>
    
      <div id="rankDisplay">Rank: Unranked</div>
      <div id="progressTracking">
        <div id="dailyStreakDisplay">Daily Streak: 0</div>
        <div id="correctTranslationCounter">Correct Translations: 0</div>
        <canvas id="progressChart"></canvas>
      </div>

      <form id="changePasswordForm">
        <input
          type="password"
          id="currentPassword"
          class="input-field"
          placeholder="Current Password"
          required
        />
        <input
          type="password"
          id="newPassword"
          class="input-field"
          placeholder="New Password"
          required
        />
        <button type="submit" aria-label="Change Password">
          <i class="fas fa-key"></i> Change Password
        </button>
      </form>

      <div id="themeSelection">
        <button id="cycleThemeBtn" aria-label="Cycle Theme">
          <i class="fas fa-palette"></i>
        </button>
      </div>

      <div id="profilePicContainer">
        <button id="profilePicBtn" aria-label="Change Profile Picture">
          <i class="fas fa-user-circle"></i>
        </button>
        <div id="profilePicMenu" style="display: none">
          <h3>Select a Profile Picture</h3>
          <div id="profilePicOptions"></div>
        </div>
      </div>

      <div class="navbar">
        <a href="vocabulary.html" class="navButtons"><i class="fas fa-list"></i></a>
        <a href="index.html" class="navButtons"><i class="fas fa-home"></i></a>
        <a href="leaderboard.html" class="navButtons"><i class="fas fa-trophy"></i></a>
        <a href="achievements.html" class="navButtons"><i class="fas fa-award"></i></a>
      </div>
    </div>
    <script src="./scripts/profiles.js" type="module"></script>
  </body>
</html>
