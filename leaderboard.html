<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbify - Leaderboard</title>
  <link rel="icon" type="image/x-icon" href="./images/verbifytransparent.png">
  <script src="https://kit.fontawesome.com/4e794a5347.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./styles/leaderboard.css">
</head>

<body>
  <div class="container">
    <h1>Verbify</h1>
    <h2 id="leaderboardTitle">Leaderboard</h2>
    <div class="language-btn-container">
      <select id="languageSelect" class="language-select" aria-label="Select Language">
        <option value="spanish">Spanish</option>
        <option value="german">German</option>
        <option value="french">French</option>
        <option value="italian">Italian</option>
        <option value="hungarian">Hungarian</option>
        <option value="japanese">Japanese</option>
        <option value="korean">Korean</option>
        <option value="turkish">Turkish</option>
        <option value="swahili">Swahili</option>
        <option value="slovak">Slovak</option>
        <option value="czech">Czech</option>
        <option value="russian">Russian</option>
        <option value="polish">Polish</option>
        <option value="serbocroatian">SerboCroatian</option>
        <option value="swedish">Swedish</option>
        <option value="norwegian">Norwegian</option>
        <option value="danish">Danish</option>
        <option value="finnish">Finnish</option>
      </select>
    </div>
        
    <div id="customAlertContainer" style="display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background-color: #f8d7da; color: #721c24; padding: 10px 20px; border: 1px solid #f5c6cb; border-radius: 5px; z-index: 1000;">
        <span id="customAlertMessage"></span>
    </div>
    
    <div class="profiles">
        <a href="profiles.html" id="profileBtn" aria-label="Go to Profile">
          <button>
            <i class="fas fa-user"></i> Profile
          </button>
        </a>
    </div>

    <ul id="leaderboardContainer" class="leaderboard-list"></ul>

    <div class="navbar">
      <a href="vocabulary.html" class="navButtons"><i class="fas fa-list"></i></a>
      <a href="index.html" class="navButtons"><i class="fas fa-home"></i></a>
      <a href="leaderboard.html" class="navButtons"><i class="fas fa-trophy"></i></a>
      <a href="achievements.html" class="navButtons"><i class="fas fa-award"></i></a>
    </div>
  </div>

  <script src="./scripts/leaderboard.js" type="module"></script>
</body>

</html>
